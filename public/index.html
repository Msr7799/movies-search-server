<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Any Movie API</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, "Segoe UI", sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #090b10; color: #f7f7f8; }
      main { width: min(720px, calc(100% - 40px)); padding: 36px; border: 1px solid #292d38; border-radius: 24px; background: #11141c; box-sizing: border-box; }
      h1 { margin: 0 0 12px; font-size: clamp(2rem, 7vw, 3.5rem); }
      p { color: #b9bfcc; line-height: 1.8; }
      ul { margin: 24px 0 0; padding: 0; list-style: none; display: grid; gap: 10px; direction: ltr; text-align: left; }
      a { display: block; padding: 13px 16px; border-radius: 12px; color: #b9e4ff; background: #191e29; text-decoration: none; font-family: ui-monospace, monospace; }
      a:hover { background: #222a38; }
      small { display: block; margin-top: 24px; color: #7f8797; }
    </style>
  </head>
  <body>
    <main>
      <h1>Any Movie API</h1>
      <p>الخادم يعمل. استخدم الروابط التالية لفحص الجاهزية وعقد الواجهة ومزوّدي العرض القانونيين.</p>
      <ul>
        <li><a href="/api/v1/health">GET /api/v1/health</a></li>
        <li><a href="/api/v1/providers">GET /api/v1/providers</a></li>
        <li><a href="/api/openapi">GET /api/openapi</a></li>
      </ul>
      <small>Search and suggestion endpoints accept POST requests only.</small>
    </main>
  </body>
</html>
